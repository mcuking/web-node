## WASI/wasm32-wasip1 target for the web-node browser Node runtime (M119).
##
## OpenSSL ships no WASI target, so we add one. The build is driven by
## `native/build.mjs` (`wn_openssl`), which copies OpenSSL's own source into a
## scratch dir, drops this file into `Configurations/`, and runs
## `perl ./Configure wasm32-wasip1 && make build_libs`.
##
## Two non-obvious choices, both learned the hard way:
##
##   * `no-secure-memory` — otherwise `crypto/mem_sec.c` needs mmap/mprotect/
##     mlock/PROT_NONE, which WASI does not have.
##   * **no `obj_extension`** — OpenSSL derives the *dependency file* suffix from
##     `depext = $target{obj_extension} || '.d'`. Setting `obj_extension => ".o"`
##     makes it write `-MMD -MF x.o.tmp`, then `cmp x.o.tmp x.o` (always
##     different) and `mv x.o.tmp x.o`, i.e. it overwrites every object file with
##     its dependency list. The default `.o` is already correct, so leave it out.
my %targets = (
    "wasm32-wasip1" => {
        inherit_from     => [ "BASE_common" ],
        sys_id           => "WASI",
        CC               => "clang",
        CFLAGS           => "-Os",
        cflags           => "-Os -ffunction-sections -fdata-sections -DOPENSSL_NO_SOCK -DOPENSSL_NO_ASYNC -DOPENSSL_NO_DGRAM -DNO_SYSLOG -DOPENSSL_USE_IPV6=0 --target=wasm32-wasip1",
        AR               => "llvm-ar",
        ARFLAGS          => "rc",
        RANLIB           => "llvm-ranlib",
        RC               => "",
        LD               => "clang",
        lflags           => "--target=wasm32-wasip1",
        ex_libs          => "",
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        thread_scheme    => "(none)",
        dso_scheme       => undef,
        shared_target    => "",
        shared_extension => "",
        lib_extension    => ".a",
        bin_extension    => "",
        disable          => [
            "asm", "async", "engine", "dso", "shared", "threads", "sock",
            "ui-console", "legacy", "module", "tests", "apps", "docs",
            "secure-memory",
        ],
    },
);
